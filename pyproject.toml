[tool.pytest.ini_options]
addopts = "-vs --html=reports/report.html --self-contained-html"
log_cli = true
log_cli_level = "INFO"
log_level = "INFO"
log_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

markers = [
    "dodaj: testy dodawania",
    "odejmij: testy odejmowania",
    "xd: testy",
    "login: testy logowania",
    "create_employee: testy tworzenia pracownika",
    "update_employee: testy aktualizowania pracownika",
    "delete_employee: testy usuwania pracownika",
    "ui_login_old: testy ui logowania old",
    "ui_login_pom: testy ui logowania pom"
]